name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      API_INTERNAL_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Enable Corepack before any Yarn call so Yarn 4.2.2 from packageManager is
      # used; setup-node's yarn cache step would otherwise run global Yarn 1.
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn verify
