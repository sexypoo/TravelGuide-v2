name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: travelguide_test
          POSTGRES_PASSWORD: travelguide
          POSTGRES_USER: travelguide
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travelguide -d travelguide_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://travelguide:travelguide@localhost:5432/travelguide_test
      TEST_DATABASE_URL: postgresql://travelguide:travelguide@localhost:5432/travelguide_test
      API_PORT: 3001
      WEB_ORIGIN: http://localhost:3000
      JWT_SECRET: ci-only-test-secret-not-for-production
      JWT_EXPIRES_IN: 24h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Enable Corepack before any Yarn call so Yarn 4.2.2 from packageManager is
      # used; setup-node's yarn cache step would otherwise run global Yarn 1.
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn verify
