services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travelguide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travelguide}
      POSTGRES_USER: ${POSTGRES_USER:-travelguide}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - travelguide_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  travelguide_postgres_data:
